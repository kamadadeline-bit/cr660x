name: Build Xiaomi CR6608 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-cr660x.yml"
      - "files/**"
      - "config/**"

permissions:
  contents: read
  actions: write

concurrency:
  group: cr6608-lede-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Cancel older builds of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build-cr660x.yml --limit 50 --json databaseId,status \
            --jq '.[] | select(.status == "in_progress" or .status == "queued") | .databaseId' |
          while read -r id; do
            [ -n "$id" ] || continue
            if [ "$id" != "$GITHUB_RUN_ID" ]; then
              echo "Canceling stale run $id"
              gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool llvm lrzsz libnsl-dev ninja-build p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim \
            wget xmlto xxd xz-utils zlib1g-dev

      - name: Get LEDE source and prepare CR6608 profile
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git lede

          # CR6608-specific device identity; use the shared CR660x image recipe.
          cp lede/target/linux/ramips/dts/mt7621_xiaomi_mi-router-cr660x.dts lede/target/linux/ramips/dts/mt7621_xiaomi_mi-router-cr6608.dts
          sed -i 's/xiaomi,mi-router-cr660x/xiaomi,mi-router-cr6608/; s/Xiaomi Mi Router CR660x/Xiaomi Mi Router CR6608/' lede/target/linux/ramips/dts/mt7621_xiaomi_mi-router-cr6608.dts

          python3 - <<'PY'
          from pathlib import Path
          p = Path("lede/target/linux/ramips/image/mt7621.mk")
          s = p.read_text()
          needle = "TARGET_DEVICES += xiaomi_mi-router-cr660x" + chr(10)
          if s.count(needle) != 1:
              raise SystemExit("Expected exactly one CR660x profile declaration; refusing to patch an unknown layout")
          addition = """
          define Device/xiaomi_mi-router-cr6608
            $(Device/xiaomi_mi-router-cr660x)
            DEVICE_DTS := mt7621_xiaomi_mi-router-cr6608
            DEVICE_MODEL := Mi Router CR6608
            SUPPORTED_DEVICES := xiaomi,mi-router-cr6608
          endef
          TARGET_DEVICES += xiaomi_mi-router-cr6608
          """
          p.write_text(s.replace(needle, needle + addition, 1))
          PY

          # CR6608 has a distinct compatible string. Without a matching board.d
          # case, first-boot network generation falls back to lan1..lan4/wan,
          # while this CR660x DTS uses the swconfig switch ports. Alias both
          # interface and MAC setup to the known CR660x layout.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lede/target/linux/ramips/mt7621/base-files/etc/board.d/02_network")
          s = p.read_text()
          old_if = "xiaomi,mi-router-cr660x)\n\t\tucidef_add_switch"
          new_if = "xiaomi,mi-router-cr660x|\\\n\txiaomi,mi-router-cr6608)\n\t\tucidef_add_switch"
          if s.count(old_if) != 1:
              raise SystemExit("Could not find the CR660x interface setup case")
          s = s.replace(old_if, new_if, 1)
          old_mac = "xiaomi,mi-router-cr660x)\n\t\tlan_mac="
          new_mac = "xiaomi,mi-router-cr660x|\\\n\txiaomi,mi-router-cr6608)\n\t\tlan_mac="
          if s.count(old_mac) != 1:
              raise SystemExit("Could not find the CR660x MAC setup case")
          s = s.replace(old_mac, new_mac, 1)
          if s.count("xiaomi,mi-router-cr6608") != 2:
              raise SystemExit("CR6608 board aliases were not added to both network and MAC setup")
          p.write_text(s)
          print("CR6608 first-boot LAN switch and MAC setup patched.")
          PY

          # The upstream UA3F source tree stores its OpenWrt package Makefile
          # under openwrt/. Flatten only those packaging files into a package
          # root so the LEDE build system can discover the package Makefile.
          git clone --depth 1 https://github.com/SunBK201/UA3F.git lede/package/UA3F
          test -f lede/package/UA3F/go.mod
          test -f lede/package/UA3F/openwrt/Makefile
          cp -a lede/package/UA3F/openwrt/. lede/package/UA3F/
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lede/package/UA3F/Makefile")
          s = p.read_text()
          for old, new in [
              ("../go.mod", "go.mod"),
              ("../go.sum", "go.sum"),
              ("../main.go", "main.go"),
              ("../cmd", "cmd"),
              ("../internal", "internal"),
          ]:
              s = s.replace(old, new)
          p.write_text(s)
          PY
          test -f lede/package/UA3F/Makefile
          test -f lede/package/UA3F/files/ua3f.conf

          # OpenClash's package Makefile is in its luci-app-openclash subdirectory.
          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/OpenClash
          test -f /tmp/OpenClash/luci-app-openclash/Makefile
          mkdir -p lede/package/luci-app-openclash
          cp -a /tmp/OpenClash/luci-app-openclash/. lede/package/luci-app-openclash/

          # Add the NetKeeper/闪讯 dialer and interception UI as source packages.
          # These are PPPoE/NetKeeper packages, not an H3C iNode authenticator.
          git clone --depth 1 https://github.com/YYuan996/netkeeper-interception.git /tmp/netkeeper-interception
          mkdir -p lede/package/feeds/netkeeper
          for p in netkeeper luci-proto-netkeeper netkeeper-interception luci-app-netkeeper-interception; do
            test -f "/tmp/netkeeper-interception/$p/Makefile"
            cp -a "/tmp/netkeeper-interception/$p" lede/package/feeds/netkeeper/
          done

          # The upstream Makefiles search for PKG_RELEASE_VERSION, which this
          # LEDE tree does not define. Match the actual PPPD module ABI directory.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("lede/package/feeds/netkeeper")
          pppd_line = "PPPD_VER := $(shell sed -n 's/^PKG_VERSION:=//p' $(TOPDIR)/package/network/services/ppp/Makefile | head -n1)"
          for rel in ("netkeeper/Makefile", "netkeeper-interception/Makefile"):
              p = root / rel
              s = p.read_text()
              updated, count = re.subn(r"^PPPD_VER\s*:=.*$", lambda _: pppd_line, s, count=1, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Could not set matching PPP ABI version in {p}")
              p.write_text(updated)
          patched = 0
          for package in ("netkeeper", "netkeeper-interception"):
              for p in (root / package / "src").glob("*.c"):
                  s = p.read_text()
                  if '#include "pppd/pppd.h"' not in s:
                      continue
                  if '#include "pppd/upap.h"' not in s:
                      s = s.replace(
                          '#include "pppd/pppd.h"',
                          '#include "pppd/pppd.h"\n#include "pppd/upap.h"\n#include "pppd/chap.h"',
                          1
                      )
                  marker = '#include "pppd/chap.h"'
                  if "extern char user[MAXNAMELEN];" not in s:
                      if marker not in s:
                          raise SystemExit(f"Missing PPP header marker in {p}")
                      s = s.replace(
                          marker,
                          marker + "\nextern char user[MAXNAMELEN];\nextern char passwd[MAXSECRETLEN];",
                          1
                      )
                  s = s.replace(
                      "void print_hex __P(( unsigned char *, uint8_t,  printer_func, void *));",
                      "void print_hex(unsigned char *, uint8_t, printer_func, void *);"
                  )
                  s = s.replace(
                      "void print_hex_to_file __P(( unsigned char *, uint8_t,  printer_func, FILE *));",
                      "void print_hex_to_file(unsigned char *, uint8_t, printer_func, FILE *);"
                  )
                  p.write_text(s)
                  patched += 1
          if patched < 2:
              raise SystemExit(f"Expected to patch both legacy PPP plugins, patched {patched}")
          print(f"NetKeeper ABI and PPP 2.5.x compatibility fixes applied to {patched} C sources.")
          PY

          mkdir -p lede/files
          if [ -d files ]; then cp -a files/. lede/files/; fi

      - name: Update feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure CR6608 and requested packages
        working-directory: lede
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6608=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables-json=y

          CONFIG_PACKAGE_ua3f=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-turboacc=y

          # UA3F 3.x uses iptables TPROXY/NFQUEUE modules; include its real
          # runtime dependencies alongside the requested nftables/BPF packages.
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_iptables-mod-nfqueue=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y

          # NetKeeper/闪讯 dialer + interception service + LuCI protocol/UI.
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_rp-pppoe-server=y
          CONFIG_PACKAGE_netkeeper=y
          CONFIG_PACKAGE_luci-proto-netkeeper=y
          CONFIG_PACKAGE_netkeeper-interception=y
          CONFIG_PACKAGE_luci-app-netkeeper-interception=y

          CONFIG_PACKAGE_kmod-nft-queue=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-sched-bpf=y
          CONFIG_PACKAGE_libubox-lua=y

          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          EOF

          make defconfig

          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6608=y$' .config
          grep -q 'compatible = "xiaomi,mi-router-cr6608"' target/linux/ramips/dts/mt7621_xiaomi_mi-router-cr6608.dts
          grep -q 'define Device/xiaomi_mi-router-cr6608' target/linux/ramips/image/mt7621.mk
          test "$(grep -c 'xiaomi,mi-router-cr6608' target/linux/ramips/mt7621/base-files/etc/board.d/02_network)" -ge 2

          for p in ua3f luci-app-openclash luci-app-turboacc kmod-nft-queue kmod-nft-tproxy kmod-sched-bpf libubox-lua firewall4 nftables-json netkeeper luci-proto-netkeeper netkeeper-interception luci-app-netkeeper-interception; do
            grep -q "^CONFIG_PACKAGE_${p}=y$" .config || {
              echo "ERROR: requested package ${p} was not selected after make defconfig"
              exit 1
            }
          done

          echo "Confirmed selected target and packages:"
          grep -E '^CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6608=y$|^CONFIG_PACKAGE_(ua3f|luci-app-openclash|luci-app-turboacc|kmod-nft-queue|kmod-nft-tproxy|kmod-sched-bpf|libubox-lua|firewall4|nftables-json)=y$' .config

      - name: Download sources with visible progress and a hard timeout
        working-directory: lede
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          echo "Starting source download. Verbose output identifies slow or failing packages."
          timeout --signal=TERM --kill-after=30s 45m make download -j8 V=s
          echo "Source download finished."

      - name: Build firmware
        working-directory: lede
        run: make V=s -j2

      - name: Verify package artifacts and configured defaults
        working-directory: lede
        run: |
          grep -Fq "option server_mode 'TPROXY'" files/etc/config/ua3f
          grep -Fq "option port '1080'" files/etc/config/ua3f
          grep -Fq "option rewrite_mode 'GLOBAL'" files/etc/config/ua3f
          grep -Fq "option ua 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.5845.97 Safari/537.36 Core/1.116.569.400 QQBrowser/19.7.6765.400'" files/etc/config/ua3f
          grep -Fq "option l3_rewrite_ttl '1'" files/etc/config/ua3f
          grep -Fq "option l3_rewrite_ttl_value '64'" files/etc/config/ua3f
          grep -Fq "option l3_rewrite_tcpts '1'" files/etc/config/ua3f
          grep -Fq "option l3_rewrite_bpf_offload '0'" files/etc/config/ua3f
          grep -Fq "option sw_flow '0'" files/etc/config/turboacc
          grep -Fq "option hw_flow '0'" files/etc/config/turboacc
          grep -Fq "option sfe_flow '0'" files/etc/config/turboacc
          grep -Fq "option fullcone_nat '0'" files/etc/config/turboacc
          grep -Fq "option bbr_cca '0'" files/etc/config/turboacc

          for p in ua3f luci-app-openclash luci-app-turboacc kmod-nft-queue kmod-nft-tproxy kmod-sched-bpf libubox-lua; do
            artifact="$(find bin -type f \( -name "${p}_*.ipk" -o -name "${p}_*.apk" \) -print -quit)"
            if [ -z "$artifact" ]; then
              echo "ERROR: build output missing package artifact for ${p}"
              exit 1
            fi
            echo "${p}: ${artifact}"
          done

          # Verify these packages are in the final image, not only downloadable
          # artifacts; matching kernel modules must not be pulled from another feed.
          manifest="$(find bin/targets/ramips/mt7621 -maxdepth 1 -type f -name '*manifest*' -print -quit)"
          if [ -z "$manifest" ]; then
            echo "ERROR: target package manifest missing"
            exit 1
          fi
          for p in kmod-nft-queue kmod-nft-tproxy kmod-sched-bpf libubox-lua netkeeper luci-proto-netkeeper netkeeper-interception luci-app-netkeeper-interception; do
            grep -Eq "^${p}[[:space:]]+-[[:space:]]" "$manifest" || {
              echo "ERROR: ${p} was not included in the final firmware manifest"
              exit 1
            }
          done
          echo "Verified UA3F and NetKeeper packages in firmware manifest: $manifest"

          find bin/targets/ramips/mt7621 -maxdepth 1 -type f -print

      - name: Upload firmware and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: cr6608-firmware
          path: |
            lede/bin/targets/ramips/mt7621/
            lede/.config
            lede/files/etc/config/ua3f
            lede/files/etc/config/turboacc
          if-no-files-found: error
          retention-days: 14
